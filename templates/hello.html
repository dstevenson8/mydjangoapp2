<!DOCTYPE html>
<html>
<head><title>Hello Form</title></head>
<body>
    <h1>Say Hello</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Your name">
        <button type="submit">Submit</button>
    </form>

    <h2>Past Entries:</h2>
    <ul>
        {% for entry in names %}
            <li>{{ entry.name }} ({{ entry.submitted_at }})</li>
        {% empty %}
            <li>No entries yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
